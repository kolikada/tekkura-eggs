scripts:
  installation:
    script: |-
      #!/bin/bash
      # Tekkura: the program comes with the pinned image and is copied in at
      # every start, so the install only prepares .env. It never replaces a
      # key already there: upstream appended a new one at every reinstall,
      # and a new key makes everything encrypted with the old one unreadable.

      output_file="/mnt/server/.env"
      touch "$output_file"

      if ! grep -q '^ENCRYPTION_KEY=.' "$output_file"; then
          echo "ENCRYPTION_KEY=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$output_file"
          echo "Generated an encryption key. Keep .env safe: without this key the bot's data cannot be read."
      fi

      # Wings fills these in at every start from the server's own address.
      grep -q '^HTTP_EXTERNAL=' "$output_file" || echo "HTTP_EXTERNAL=" >> "$output_file"
      grep -q '^HTTP_PORT=' "$output_file" || echo "HTTP_PORT=" >> "$output_file"

      mkdir -p /mnt/server/user
      echo "Environment ready in $output_file"
    container: 'debian:bookworm-slim'
    entrypoint: bash
