description: |-
  Posts your game servers' status and who is playing to a Discord channel, and keeps it up to date. Works with most games, including the ones we host.
  Set it up from its own web page, at the address on the Overview. Open source by a-sync (AGPL-3.0); Tekkura installs a pinned release.
