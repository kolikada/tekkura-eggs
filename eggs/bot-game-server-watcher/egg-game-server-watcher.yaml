  - '!/data/**'
startup_commands:
  Default: 'env PORT=${SERVER_PORT} /usr/local/bin/node /home/container/dist/server.js'
config:
  files:
    .env:
      parser: file
      find:
        DISCORD_BOT_TOKEN: 'DISCORD_BOT_TOKEN={{server.environment.DISCORD_TOKEN}}'
  startup:
    done: 'starting loop...'
  logs: {  }
  stop: ^C
scripts:
  installation:
    script: |-
      #!/bin/bash
      # Tekkura: a pinned release of a-sync/game-server-watcher, never the
      # moving main branch, rebuilt from scratch on every reinstall. Only
      # data/, where its settings live, survives.

      apt-get update && apt-get install -y --no-install-recommends ca-certificates curl tar

      mkdir -p /mnt/server
      cd /mnt/server

      find . -mindepth 1 -depth ! -path './data' ! -path './data/*' -exec rm -rf {} +

      curl -fLo gsw.tar.gz "https://api.github.com/repos/a-sync/game-server-watcher/tarball/${VERSION}" || exit 1
      tar -xzf gsw.tar.gz --strip-components=1
      rm gsw.tar.gz

      npm ci --no-audit --no-fund || exit 1
      npm run build || exit 1
      npm prune --omit=dev
      mkdir -p data
      # The token reaches the bot through this file (Wings writes the line at
      # every start), never the startup line, which the console prints.
      cp .env.example .env

      echo "-----------------------------------------"
      echo "Game Server Watcher ${VERSION} installed"
      echo "-----------------------------------------"
    container: 'node:22-bookworm-slim'
    entrypoint: bash
