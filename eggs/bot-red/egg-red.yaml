scripts:
  installation:
    script: |-
      #!/bin/bash
      # Red-DiscordBot install script
      # Tekkura: pinned to the release in VERSION, which customers cannot change.
      # Red goes into the server's own ~/.local, its data into data/, which a
      # reinstall keeps.

      apt update
      apt -y install git ca-certificates build-essential libssl-dev libffi-dev

      cd /mnt/server
      mkdir -p data .tmp .config/Red-DiscordBot

      echo -e "Installing Red ${VERSION}..."
      export PYTHONUSERBASE=/mnt/server/.local TMPDIR=/mnt/server/.tmp
      pip install --upgrade pip
      pip install --user --upgrade wheel "Red-DiscordBot==${VERSION}" || exit 1

      # Tekkura: the instance config is written here rather than downloaded,
      # and points Red at data/ so cogs and settings sit where the customer
      # can see them. Never overwritten, so a reinstall keeps the instance.
      if [ ! -f .config/Red-DiscordBot/config.json ]; then
          cat > .config/Red-DiscordBot/config.json <<'JSON'
      {
          "tekkura": {
              "DATA_PATH": "/home/container/data",
              "COG_PATH_APPEND": "cogs",
              "CORE_PATH_APPEND": "core",
              "STORAGE_TYPE": "JSON",
              "STORAGE_DETAILS": {}
          }
      }
      JSON
      fi

      echo "-------------------------------------------------------"
      echo "Installation completed"
      echo "-------------------------------------------------------"
    container: 'python:3.11-slim-bookworm'
    entrypoint: bash
